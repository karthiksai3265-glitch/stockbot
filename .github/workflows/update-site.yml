# Runs the full update twice per weekday and publishes the dashboard to GitHub Pages (free).
# Times are UTC: 20:30 and 06:30 UTC are about 07:30 and 17:30 in Sydney (daylight time).
name: Update StockBot site
on:
  schedule:
    - cron: "30 20 * * 0-4"
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stockbot
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Restore database (keeps price history, paper portfolio and model versions between runs)
        uses: actions/cache@v4
        with:
          path: backend/stockbot.db
          key: stockbot-db-${{ github.run_id }}
          restore-keys: stockbot-db-
      - name: Update data and recommendations
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m app.run_daily
      - name: Build the website page
        working-directory: backend
        run: python -m app.export_site --out ../site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
